<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EngControl | Gestão de Obras Premium</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
body{font-family:'Manrope',sans-serif;background:#0a0a0a}
.serif{font-family:'Instrument Serif',serif}
.glass{backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);}
</style>
</head>
<body class="bg-[#0a0a0a] text-white">
<div id="app"></div>
<script>
let CONFIG=null, clienteAtivo=null;
async function getConfig(){ const r=await fetch('/api/config'); CONFIG=await r.json(); return CONFIG; }
async function api(tabela,m='GET',b=null,q=''){ if(!CONFIG) await getConfig(); const o={method:m, headers:{apikey:CONFIG.supabaseKey, Authorization:`Bearer ${CONFIG.supabaseKey}`, 'Content-Type':'application/json'}}; if(b) o.body=JSON.stringify(b); const res=await fetch(`${CONFIG.supabaseUrl}/rest/v1/${tabela}${q}`,o); return res.json(); }

async function init(){ await getConfig(); carregar(); }
async function carregar(){
document.getElementById('app').innerHTML=`<div class="min-h-screen flex items-center justify-center bg-[#0a0a0a]"><div class="w-8 h-8 border-2 border-white/20 border-t-white rounded-full animate-spin"></div></div>`;
const clientes = await api('clientes','GET',null,'?order=created_at.desc')||[];
render(clientes);
}

function render(clientes){
document.getElementById('app').innerHTML=`
<div class="min-h-screen bg-[#f6f5f2]">
  <!-- HEADER PREMIUM -->
  <div class="sticky top-0 z-30 bg-[#0a0a0a] text-white">
    <div class="max-w-[1440px] mx-auto px-8 h-[64px] flex justify-between items-center">
      <div class="flex items-center gap-8">
        <div class="flex items-center gap-3"><div class="w-8 h-8 bg-white text-black rounded-full flex items-center justify-center font-extrabold text-[14px]">E</div><span class="font-extrabold tracking-tight">ENGCONTROL</span><span class="text-[10px] tracking-[0.2em] text-white/40 ml-3 hidden md:block">GESTÃO DE OBRAS</span></div>
        <div class="hidden md:flex gap-6 text-[12px] text-white/50 font-semibold tracking-widest"><span class="text-white">GERENCIAL</span><a href="/login-cliente.html" class="hover:text-white">ÁREA DO CLIENTE</a></div>
      </div>
      <button onclick="telaNovo()" class="bg-white text-black px-6 h-9 rounded-full text-[13px] font-bold hover:bg-zinc-200 transition">+ NOVA OBRA</button>
    </div>
  </div>

  <!-- HERO COM IMAGEM DE OBRA -->
  <div class="max-w-[1440px] mx-auto px-4 md:px-8 pt-4">
    <div class="relative h-[420px] rounded-[28px] overflow-hidden bg-black">
      <img src="https://images.unsplash.com/photo-1504307651254-35680f356dfd?q=80&w=2070&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover opacity-70">
      <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
      <div class="absolute inset-0 p-8 md:p-12 flex flex-col justify-between">
        <div class="flex justify-between"><div class="bg-white/10 glass border border-white/10 rounded-full px-4 py-2 text-[11px] tracking-widest text-white">🏗️ ESCRITÓRIO ATIVO • ${new Date().toLocaleDateString('pt-BR')}</div><div class="bg-white text-black rounded-full px-4 py-2 text-[11px] font-bold">${clientes.length} OBRAS ATIVAS</div></div>
        <div><h1 class="serif text-[52px] md:text-[84px] leading-[0.9] tracking-tight text-white">Obras que<br><span class="italic text-[#f5e8c7]">impressionam.</span></h1><p class="text-white/60 mt-5 max-w-[420px] text-[14px] leading-relaxed">Gestão completa, documentos organizados e cliente acompanhando tudo em tempo real. Sem WhatsApp bagunçado.</p></div>
      </div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="max-w-[1440px] mx-auto px-4 md:px-8 py-6 grid grid-cols-12 gap-4">
    <div class="col-span-12 md:col-span-8 grid grid-cols-3 gap-4">
      <div class="bg-white rounded-[20px] p-6 border border-black/5"><p class="text-[11px] tracking-widest font-bold text-zinc-400">FATURAMENTO / MÊS</p><p class="text-[28px] font-extrabold mt-2 tracking-tight">R$ --</p><p class="text-[11px] text-green-600 mt-2 font-semibold">↑ Configure depois</p></div>
      <div class="bg-white rounded-[20px] p-6 border border-black/5"><p class="text-[11px] tracking-widest font-bold text-zinc-400">EM ANDAMENTO</p><p class="text-[28px] font-extrabold mt-2 tracking-tight">${clientes.filter(c=>c.status!=='Concluído').length}</p><p class="text-[11px] text-zinc-500 mt-2">Obras ativas</p></div>
      <div class="bg-[#0a0a0a] rounded-[20px] p-6 text-white"><p class="text-[11px] tracking-widest font-bold text-white/40">TAXA DE ENTREGA</p><p class="text-[28px] font-extrabold mt-2">98%</p><p class="text-[11px] text-white/50 mt-2">Dentro do prazo</p></div>
    </div>
    <div class="col-span-12 md:col-span-4 bg-white rounded-[20px] p-6 border flex items-center gap-4">
      <img src="https://images.unsplash.com/photo-1541888946425-d81bb19240f6?q=80&w=100" class="w-16 h-16 rounded-full object-cover">
      <div><p class="font-bold text-sm">Eng. Responsável</p><p class="text-xs text-zinc-500">Seu escritório • CREA Ativo</p><div class="mt-2 flex gap-2"><span class="text-[10px] bg-black text-white px-2 py-1 rounded-full">PREMIUM</span><span class="text-[10px] bg-zinc-100 px-2 py-1 rounded-full">VERIFICADO</span></div></div>
    </div>
  </div>

  <!-- LISTA DE OBRAS -->
  <div class="max-w-[1440px] mx-auto px-4 md:px-8 pb-20">
    <div class="bg-white rounded-[28px] border border-black/5 overflow-hidden">
      <div class="p-7 flex justify-between items-center border-b"><h3 class="font-extrabold text-[16px] tracking-tight">📋 OBRAS SOB GESTÃO</h3><input id="busca" onkeyup="filtrar(this.value)" placeholder="Buscar cliente, rua, lote..." class="bg-[#f6f5f2] rounded-full px-5 py-2.5 text-[13px] w-[280px] outline-none"></div>
      ${clientes.length===0?`
      <div class="p-20 text-center">
        <div class="w-24 h-24 mx-auto bg-[#f6f5f2] rounded-full flex items-center justify-center text-3xl mb-6">🏗️</div>
        <h4 class="font-bold text-lg">Seu escritório está pronto para a primeira obra</h4>
        <p class="text-sm text-zinc-500 mt-2 max-w-[400px] mx-auto">Cadastre o cliente, anexe contrato e planta, e libere o acesso para o cliente acompanhar a obra pelo celular.</p>
        <button onclick="telaNovo()" class="mt-6 bg-black text-white px-8 py-3 rounded-full text-sm font-bold">Cadastrar Primeira Obra</button>
      </div>
      `:`
      <div class="grid grid-cols-1 md:grid-cols-3 divide-y md:divide-y-0 md:divide-x">
        ${clientes.map(c=>`
        <div onclick="abrir('${c.id}')" class="group p-7 hover:bg-[#fcfbf8] cursor-pointer transition">
          <div class="h-[180px] rounded-[18px] overflow-hidden relative bg-zinc-100 mb-5">
            <img src="https://images.unsplash.com/photo-1503387762-592deb58ef4e?q=80&w=800" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
            <div class="absolute top-3 left-3 bg-white rounded-full px-3 py-1 text-[11px] font-bold shadow">${c.progresso||5}% CONCLUÍDO</div>
            <div class="absolute bottom-3 left-3 right-3 bg-black/70 glass text-white rounded-full px-4 py-2 flex justify-between items-center text-[11px]"><span>● ${c.status||'Em andamento'}</span><span>→</span></div>
          </div>
          <h4 class="font-bold text-[16px]">${c.nome}</h4>
          <p class="text-[13px] text-zinc-500 mt-1 flex gap-1">📍 ${c.endereco_obra||'Endereço não informado'}</p>
          <div class="mt-4 flex items-center gap-3"><div class="flex-1 h-1 bg-zinc-100 rounded-full"><div class="h-1 bg-black rounded-full" style="width:${c.progresso||5}%"></div></div><span class="text-[11px] font-bold">${c.email}</span></div>
        </div>
        `).join('')}
      </div>`}
    </div>
  </div>
</div>`;

window._clientes=clientes;
}

async function abrir(id){
const [c]=await api('clientes','GET',null,`?id=eq.${id}`);
const arqs=await api('arquivos','GET',null,`?cliente_id=eq.${id}&order=created_at.desc`);
clienteAtivo=c;
document.getElementById('app').innerHTML=`
<div class="min-h-screen bg-[#f6f5f2]">
  <div class="bg-[#0a0a0a] text-white px-8 h-[56px] flex items-center gap-4"><button onclick="carregar()" class="w-8 h-8 bg-white/10 rounded-full">←</button><span class="font-bold">${c.nome}</span><span class="text-white/40 text-xs">• ${c.endereco_obra||''}</span><div class="ml-auto flex gap-2"><input type="file" id="f" class="hidden" onchange="upload(this.files[0])"><button onclick="document.getElementById('f').click()" class="bg-white text-black px-5 py-2 rounded-full text-xs font-bold">+ ANEXAR</button></div></div>
  <div class="max-w-6xl mx-auto p-8 grid grid-cols-3 gap-6">
    <div class="col-span-2 bg-white rounded-[24px] border p-6"><h3 class="font-bold mb-5">📂 Documentos (${arqs.length})</h3><div class="grid gap-3">${arqs.map(a=>`<div class="flex items-center gap-4 p-4 border rounded-2xl"><div class="w-12 h-12 bg-[#f6f5f2] rounded-xl flex items-center justify-center">${a.url.includes('pdf')?'📄':'📸'}</div><div class="flex-1"><p class="font-semibold text-sm">${a.nome}</p><p class="text-xs text-zinc-500">${new Date(a.created_at).toLocaleDateString('pt-BR')}</p></div><a href="${a.url}" target="_blank" class="bg-black text-white px-5 py-2 rounded-full text-xs font-bold">ABRIR</a></div>`).join('')||'<div class="border border-dashed rounded-2xl p-12 text-center text-sm text-zinc-400">Nenhum arquivo ainda. Anexe o primeiro.</div>'}</div></div>
    <div class="bg-white rounded-[24px] border p-6 h-fit"><p class="text-xs tracking-widest font-bold text-zinc-400">ACESSO DO CLIENTE</p><div class="mt-4 bg-[#0a0a0a] text-white rounded-2xl p-5 font-mono text-sm"><p class="text-white/50 text-xs">LOGIN</p><p class="mt-1">${c.email}</p><p class="text-white/50 text-xs mt-4">SENHA</p><p class="font-bold text-lg">${c.senha_acesso}</p></div><p class="text-[11px] text-zinc-500 mt-4">Mande para o cliente: meu-engenheiro.onrender.com/login-cliente.html</p></div>
  </div>
</div>`;
}

async function upload(file){ if(!file) return; const fd=new FormData(); fd.append('file',file); fd.append('upload_preset',CONFIG.cloudinaryPreset); const up=await (await fetch(`https://api.cloudinary.com/v1_1/${CONFIG.cloudinaryName}/auto/upload`,{method:'POST',body:fd})).json(); await api('arquivos','POST',{cliente_id:clienteAtivo.id,nome:file.name,url:up.secure_url,public_id:up.public_id}); abrir(clienteAtivo.id); }

function telaNovo(){
document.getElementById('app').innerHTML=`<div class="min-h-screen bg-[#0a0a0a] flex items-center justify-center p-6"><form onsubmit="criar(event)" class="bg-white w-full max-w-[480px] rounded-[28px] p-8"><div class="w-12 h-12 bg-black text-white rounded-full flex items-center justify-center mb-6">🏗️</div><h2 class="text-[24px] font-extrabold tracking-tight">Nova Obra Premium</h2><p class="text-sm text-zinc-500 mb-6">O cliente vai receber acesso exclusivo</p><input name="nome" required placeholder="Nome do Cliente *" class="w-full bg-[#f6f5f2] border border-black/5 rounded-xl p-4 text-sm mb-3 outline-none"><input name="email" required type="email" placeholder="Email do cliente (login) *" class="w-full bg-[#f6f5f2] rounded-xl p-4 text-sm mb-3"><input name="senha" required placeholder="Senha que o cliente vai usar *" class="w-full bg-[#f6f5f2] rounded-xl p-4 text-sm mb-3"><input name="endereco" placeholder="Endereço da Obra - Bairro, Lote, Cidade" class="w-full bg-[#f6f5f2] rounded-xl p-4 text-sm mb-6"><button class="w-full bg-black text-white rounded-full py-4 font-bold text-sm">CRIAR OBRA E LIBERAR ACESSO →</button><button type="button" onclick="carregar()" class="w-full mt-3 text-sm text-zinc-500">Cancelar</button></form></div>`;
}
async function criar(e){ e.preventDefault(); const fd=new FormData(e.target); await api('clientes','POST',{nome:fd.get('nome'),email:fd.get('email'),senha_acesso:fd.get('senha'),endereco_obra:fd.get('endereco'),progresso:5,status:'Em andamento'}); carregar(); }
function filtrar(t){ const f=window._clientes.filter(c=>(c.nome+c.email+(c.endereco_obra||'')).toLowerCase().includes(t.toLowerCase())); render(f); }
init();
</script>
</body>
</html>
