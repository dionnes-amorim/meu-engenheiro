<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Engenheiro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:#f7f3ed;
  display:flex; align-items:center; justify-content:center;
  font-family:"Inter", sans-serif;
  padding:24px;
}
.caixa{
  width:100%; max-width:420px;
  background:#fff;
  border:1.5px solid #1a1a1a;
  padding:32px 28px;
}
.topo{
  display:flex; justify-content:space-between; align-items:center;
  padding-bottom:20px; border-bottom:1.5px solid #1a1a1a;
  margin-bottom:28px;
}
.logo{font-weight:700; font-size:14px; letter-spacing:.06em}
.ano{font-size:10px; opacity:.6}

.botoes{display:flex; flex-direction:column; gap:14px}

.botao{
  height:68px;
  border:1.5px solid #1a1a1a;
  background:#fff;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px;
  text-decoration:none;
  color:#1a1a1a;
  font-size:13px; font-weight:700;
  letter-spacing:.04em;
  transition:.12s;
}
.botao:hover{
  background:#1a1a1a;
  color:#f7f3ed;
}
.botao.ouro{
  background:#c9a86a;
  border-color:#c9a86a;
  color:#1a1a1a;
}
.botao.ouro:hover{
  background:#b8965a;
  border-color:#b8965a;
  color:#fff;
}
.seta{font-size:16px}

.rodape{
  margin-top:28px;
  font-size:9px;
  letter-spacing:.18em;
  opacity:.5;
  text-align:center;
}
</style>
</head>
<body>
  <div class="caixa">
    <div class="topo">
      <div class="logo">MEU ENGENHEIRO</div>
      <div class="ano">2026</div>
    </div>

    <div class="botoes">
      <a href="pagina-inicial.html" class="botao ouro">
        <span>PAINEL DO ENGENHEIRO</span>
        <span class="seta">→</span>
      </a>

      <a href="public/minha-obra/minha-obra.html" class="botao">
        <span>MEUS PROJETOS</span>
        <span class="seta">→</span>
      </a>
    </div>

    <div class="rodape">OBRA • GESTÃO • CONSTRUÇÃO</div>
  </div>
</body>
</html>
