<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar na Obra</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f6f5f2] min-h-screen flex items-center justify-center p-6">
<div class="bg-white w-full max-w-[380px] rounded-[24px] p-8 border shadow-sm">
  <div class="w-10 h-10 bg-black text-white rounded-full flex items-center justify-center font-bold mx-auto">E</div>
  <h1 class="font-extrabold text-center mt-4">Acessar minha obra</h1>
  <p class="text-xs text-zinc-500 text-center mt-1">Use o login que seu engenheiro enviou</p>
  <div class="mt-6 space-y-3">
    <input id="email" type="email" placeholder="seu email" value="teste@teste" class="w-full border rounded-xl p-3.5 text-sm">
    <input id="senha" placeholder="senha" value="teste" class="w-full border rounded-xl p-3.5 text-sm">
    <p id="erro" class="hidden text-xs text-red-500 bg-red-50 p-3 rounded-xl text-center"></p>
    <button id="btn" onclick="fazerLogin()" class="w-full bg-black text-white rounded-full py-3.5 font-bold text-sm">ENTRAR →</button>
  </div>
  <p class="text-[11px] text-zinc-400 text-center mt-6">Se não entrar, abra o console (F12)</p>
</div>
<script>
async function fazerLogin(){
  const btn=document.getElementById('btn');
  const erro=document.getElementById('erro');
  btn.innerText='ENTRANDO...';
  btn.disabled=true;
  erro.classList.add('hidden');
  try{
    const CONFIG = await (await fetch('/api/config')).json();
    console.log('CONFIG:',CONFIG);
    const email=document.getElementById('email').value.trim().toLowerCase();
    const senha=document.getElementById('senha').value.trim();
    const url=`${CONFIG.supabaseUrl}/rest/v1/clientes?email=eq.${encodeURIComponent(email)}&senha_acesso=eq.${encodeURIComponent(senha)}&select=*`;
    console.log('Buscando:',url);
    const res=await fetch(url,{headers:{apikey:CONFIG.supabaseKey, Authorization:`Bearer ${CONFIG.supabaseKey}`}});
    const data=await res.json();
    console.log('Retorno:',data);
    if(!data || data.length===0){
      throw new Error('E-mail ou senha não encontrados. Verifique se cadastrou teste@teste / teste na tabela clientes');
    }
    localStorage.setItem('cliente_id', data[0].id);
    // AQUI QUE TAVA FALTANDO - REDIRECIONA
    window.location.href='/minha-obra.html';
  }catch(e){
    console.error(e);
    erro.innerText=e.message;
    erro.classList.remove('hidden');
    btn.innerText='ENTRAR →';
    btn.disabled=false;
  }
}
</script>
</body></html>
