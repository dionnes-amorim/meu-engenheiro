<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#f6f5f2] flex items-center justify-center min-h-screen p-6">
<div class="bg-white w-full max-w-[380px] rounded-[24px] p-8 border">
<h1 class="font-extrabold text-center">Entrar na minha obra</h1>
<input id="email" value="teste@teste" class="w-full border rounded-xl p-3.5 mt-6 text-sm">
<input id="senha" value="teste" class="w-full border rounded-xl p-3.5 mt-3 text-sm">
<p id="erro" class="hidden text-xs text-red-500 bg-red-50 p-3 rounded-xl mt-3 text-center"></p>
<button onclick="login()" id="btn" class="w-full bg-black text-white rounded-full py-3.5 mt-4 font-bold text-sm">ENTRAR NA MINHA OBRA →</button>
</div>
<script>
async function login(){
  const btn=document.getElementById('btn'); btn.innerText='ENTRANDO...'; btn.disabled=true;
  try{
    const C=await (await fetch('/api/config')).json();
    const email=document.getElementById('email').value.trim().toLowerCase();
    const senha=document.getElementById('senha').value.trim();
    const r=await fetch(`${C.supabaseUrl}/rest/v1/clientes?email=eq.${encodeURIComponent(email)}&senha_acesso=eq.${encodeURIComponent(senha)}&select=*`,{headers:{apikey:C.supabaseKey, Authorization:`Bearer ${C.supabaseKey}`}});
    const d=await r.json();
    if(!d.length) throw new Error('Login não encontrado');
    localStorage.setItem('cliente_id', d[0].id);
    // VAI PRO PAINEL DO CLIENTE - NÃO VOLTA PRO LOGIN
    location.href='/minha-obra.html';
  }catch(e){ document.getElementById('erro').innerText=e.message; document.getElementById('erro').classList.remove('hidden'); btn.innerText='ENTRAR NA MINHA OBRA →'; btn.disabled=false; }
}
</script>
</body></html>
